# Setup 4: Kestra, self-hosted as one standalone server plus its own Postgres.
# The UI and API bind to 127.0.0.1:8088 only (use an SSH tunnel); credentials come from .env.
name: lab-kestra
services:
  kestra-db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?run lab/make-env.sh}
      POSTGRES_DB: kestra
    volumes: [kestra-db:/var/lib/postgresql/data]
  kestra:
    build: .
    image: lab/kestra:1
    restart: unless-stopped
    user: root
    command: server standalone --worker-thread=8
    depends_on: [kestra-db]
    networks: [default, lab-net]
    ports: ["127.0.0.1:8088:8080"]
    volumes:
      - kestra-storage:/app/storage
      - kestra-work:/work
    environment:
      # Kestra OSS reads secrets from SECRET_* variables, base64 encoded: {{ secret('DATABASE_URL') }}
      SECRET_DATABASE_URL: ${DATABASE_URL_DOCKER_B64:?run lab/make-env.sh}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-db:5432/kestra
            driver-class-name: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_USER:?run lab/make-env.sh}
              password: ${KESTRA_PASSWORD:?run lab/make-env.sh}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          url: http://localhost:8088/
networks:
  lab-net:
    external: true
volumes:
  kestra-db:
  kestra-storage:
  kestra-work:
